name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A running deployment is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Usage counts stay off until someone sets this repository variable
          # (Settings > Secrets and variables > Actions > Variables).
          # See docs/analytics.md before setting it.
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL }}
          # The "Publish to Zenodo" panel. No community hides it. No client ID
          # leaves it as a guide to uploading by hand. See the README.
          VITE_ZENODO_COMMUNITY: ${{ vars.VITE_ZENODO_COMMUNITY }}
          VITE_ZENODO_COMMUNITY_NAME: ${{ vars.VITE_ZENODO_COMMUNITY_NAME }}
          VITE_ZENODO_CLIENT_ID: ${{ vars.VITE_ZENODO_CLIENT_ID }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
