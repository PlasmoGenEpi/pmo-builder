name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every night, so a PMO newly accepted into the Zenodo community shows up
  # in the list of published PMOs within a day. GitHub pauses a schedule
  # after 60 days without activity in a public repository; the "Keep the
  # nightly schedule alive" step below is there to stop that.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# One deployment at a time. A running deployment is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # For the "Keep the nightly schedule alive" step only.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v6

      # Rebuilds the list of published PMOs from the Zenodo community. If
      # Zenodo cannot be read, the list already on the site is kept.
      # Enabling the workflow again, through the API, is the usual way to tell
      # GitHub the schedule is still wanted. If the schedule is paused anyway,
      # enable the workflow on the repository's Actions page or push a commit.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      # The usage count receiver is deployed from this same commit, before the
      # site, so it always knows every value the site can send. Skipped on the
      # nightly run, and when the repository has no Cloudflare token.
      - name: Deploy the usage count receiver
        if: github.event_name != 'schedule'
        working-directory: receiver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret, so the receiver is not deployed."
            exit 0
          fi
          # receiver/pnpm-workspace.yaml makes this its own project and allows
          # the build scripts of Wrangler's esbuild and workerd.
          pnpm install --frozen-lockfile
          # Tables first (receiver/migrations), so the new code finds them.
          pnpm exec wrangler d1 migrations apply pmo-builder-usage --remote
          pnpm exec wrangler deploy

      - name: Read the published PMOs from Zenodo
        run: pnpm harvest --fallback "${{ steps.pages.outputs.base_url }}/repository/"
        env:
          VITE_ZENODO_COMMUNITY: ${{ vars.VITE_ZENODO_COMMUNITY }}

      - name: Build
        run: pnpm build
        env:
          # Usage counts stay off until someone sets this repository variable
          # (Settings > Secrets and variables > Actions > Variables).
          # See docs/analytics.md before setting it.
          VITE_ANALYTICS_URL: ${{ vars.VITE_ANALYTICS_URL }}
          # The "Publish to Zenodo" panel. No community hides it. No client ID
          # leaves it as a guide to uploading by hand. See the README.
          VITE_ZENODO_COMMUNITY: ${{ vars.VITE_ZENODO_COMMUNITY }}
          VITE_ZENODO_COMMUNITY_NAME: ${{ vars.VITE_ZENODO_COMMUNITY_NAME }}
          VITE_ZENODO_CLIENT_ID: ${{ vars.VITE_ZENODO_CLIENT_ID }}
          # Translation review links (#/translate/<language>/<key>). Unset
          # turns them off. See docs/translation.md.
          VITE_TRANSLATION_REVIEW_URL: ${{ vars.VITE_TRANSLATION_REVIEW_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
